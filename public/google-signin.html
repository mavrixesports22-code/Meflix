<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Sign in to Meflix</title>
  <link rel="stylesheet" href="/google-signin.css" />
  <script type="module" src="/google-signin.js"></script>
</head>
<body>
  <main>
    <div class="brand">MEFLIX</div>
    <h1>Sign in to Meflix</h1>
    <p id="message">Continue with Google to sign in on the device where you opened Meflix.</p>
    <button id="google" type="button" disabled>Continue with Google</button>
    <a id="return" hidden>Return to Meflix</a>
    <p id="error" role="alert" hidden></p>
    <p class="note">Only continue if you started this sign-in in your Meflix app.</p>
  </main>
</body>
</html>
